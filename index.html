<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty</title>
<style>
  :root { --bg:#0f172a; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { background:radial-gradient(circle at top,#1e3a8a 0%,var(--bg) 60%);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .vid { width:min(900px, 100%); max-height:80vh; border-radius:16px; display:block; background:#000;
         box-shadow:0 20px 50px rgba(0,0,0,.5); }
  #play { position:fixed; right:20px; bottom:20px; z-index:20; background:var(--accent); color:#fff; border:0;
          border-radius:999px; width:64px; height:64px; font-size:1.7rem; cursor:pointer;
          box-shadow:0 8px 24px rgba(0,0,0,.45); transition:transform .1s; }
  #play:active { transform:scale(.92); }

  /* the meme that jumps out of a corner */
  #meme { position:fixed; width:min(300px, 45vw); z-index:15; pointer-events:none; border-radius:14px;
          opacity:0; transition:transform .35s cubic-bezier(.2,1.4,.4,1), opacity .25s; }
  #meme.tl { top:16px; left:16px;  transform:translate(-130%,-130%) rotate(-25deg); }
  #meme.tr { top:16px; right:16px; transform:translate(130%,-130%) rotate(25deg); }
  #meme.bl { bottom:16px; left:16px;  transform:translate(-130%,130%) rotate(25deg); }
  #meme.br { bottom:96px; right:16px; transform:translate(130%,130%) rotate(-25deg); }
  #meme.in { opacity:1; transform:translate(0,0) rotate(0); }
</style>
</head>
<body>
  <video class="vid" src="video.mp4" controls playsinline preload="metadata"></video>

  <img id="meme" src="https://media1.tenor.com/m/_yRGt6I8qLQAAAAC/cat-yell.gif" alt="">
  <button id="play" aria-label="Call the kitty">🔊</button>
  <audio id="snd" src="raaaah.mp3" preload="auto"></audio>

  <script>
    const meme = document.getElementById('meme'), snd = document.getElementById('snd');
    const corners = ['tl','tr','bl','br'];
    let busy = false;
    function popKitty() {
      if (busy) return; busy = true;
      meme.className = corners[Math.floor(Math.random()*4)]; // park off-screen in a random corner
      void meme.offsetWidth;                                   // reflow so the slide-in animates
      meme.classList.add('in');
      snd.currentTime = 0; snd.play().catch(()=>{});
      setTimeout(() => meme.classList.remove('in'), 2000);     // leave after 2 s
      setTimeout(() => { busy = false; }, 2400);
    }
    document.getElementById('play').addEventListener('click', popKitty);
    // Try once on open (only works where the browser allows sound without a tap)
    snd.play().then(() => { snd.pause(); popKitty(); }).catch(()=>{});
  </script>
</body>
</html>
